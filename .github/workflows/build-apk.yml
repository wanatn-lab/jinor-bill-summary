name: Build Android APK

# รันเมื่อ push เข้าสาขา android-apk หรือกดรันเองที่แท็บ Actions
on:
  push:
    branches: [android-apk]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Sync config
        run: npx cap sync android
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: jinko-sales-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
